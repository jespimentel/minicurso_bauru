site_name: Prompts, Skills e Agentes de IA para a Promotoria de Justiça
site_author: José Eduardo de Souza Pimentel
docs_dir: docs

theme:
  name: material
  language: pt
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - 'Conteúdo': 'index.md'
  - '1. Markdown, XML e Placeholders': '01-markdown-xml-placeholders.md'
  - '2. Engenharia de Prompt': '02-engenharia-de-prompt.md'
  - '3. Agentes do Copilot': '03-agentes-copilot.md'
  - '4. Skills': '04-skills.md'
  - '5. Claude no VS Code': '05-claude-vscode.md'


extra:
  generator: false

copyright: José Eduardo de Souza Pimentel - Bauru-SP, Agosto de 2026.